[package]
name = "dsh-thin-desktop"
version = "0.1.0"
description = "A thin Tauri desktop client for the DeepSeek Harness web UI"
authors = ["anson"]
edition = "2021"

[lib]
name = "dsh_thin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tokio = { version = "1", features = ["time", "net", "io-util", "rt-multi-thread", "macros"] }
ureq = { version = "3", default-features = false, features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
